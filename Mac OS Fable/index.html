<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mac OS Fable</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <!-- Boot Screen (shown on load, fades out) -->
  <div id="boot-screen">
    <div id="boot-logo">
      <!-- Apple-style SVG logo: stylized apple silhouette -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 68" width="80" height="80" fill="white">
        <!-- Apple body -->
        <path d="M47.5 22.5c-0.6-0.2-9.5-3.1-9.5-13.5 0-1.1-0.9-2-2-2s-2 0.9-2 2c0 3.8 1.1 7.3 3 10.2-1.9-0.8-4-1.2-6-1.2-4.5 0-8.7 1.9-11.5 5.3C17.2 20.4 13 18.5 8.5 18.5c-1.9 0-3.8 0.4-5.5 1.2C4.5 17 5.5 13.6 5.5 10c0-1.1-0.9-2-2-2S1.5 8.9 1.5 10c0 10.3-8.5 13.2-9.5 13.5C-9.2 23.8-10 24.8-10 26s0.8 2.2 1.5 2.5c0.6 0.2 9.5 3.1 9.5 13.5 0 1.1 0.9 2 2 2s2-0.9 2-2c0-3.8-1.1-7.3-3-10.2 1.9 0.8 4 1.2 6 1.2 4.5 0 8.7-1.9 11.5-5.3C22.8 31.6 27 33.5 31.5 33.5c1.9 0 3.8-0.4 5.5-1.2C35.5 35 34.5 38.5 34.5 42c0 1.1 0.9 2 2 2s2-0.9 2-2c0-10.3 8.5-13.2 9.5-13.5C48.8 28.2 49.5 27.2 49.5 26s-0.8-2.2-2-3.5z"/>
        <!-- Apple leaf / stem -->
        <path d="M28 4c0 0 2.5-4 6-4 0 4-3.5 5.5-6 4z"/>
        <!-- Simplified clean apple body -->
        <path d="M39 14c-1.2 0-8 2.5-8 13H17c0-10.5-6.8-13-8-13C5 14 0 19 0 26s5 17 8 17c1.5 0 5-1.5 8-5 1.5 2 3.5 5 12 5s10.5-3 12-5c3 3.5 6.5 5 8 5 3 0 8-10 8-17s-5-12-17-12z"/>
      </svg>
    </div>
    <div id="boot-bar-track"><div id="boot-bar"></div></div>
  </div>

  <!-- OS Shell (hidden initially, shown after boot) -->
  <div id="os-shell">

    <!-- Menu Bar (top, fixed) -->
    <div id="menubar">
      <div id="menubar-left">
        <button class="menu-btn" id="menu-apple" aria-label="Apple menu">
          <!-- SVG apple icon (menubar size) -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 17" width="14" height="17" fill="currentColor">
            <path d="M13.23 12.27c-.3.67-.65 1.29-1.07 1.87-.56.8-1.02 1.36-1.38 1.67-.55.5-1.14.76-1.78.77-.45 0-1-.13-1.63-.4-.63-.27-1.21-.4-1.74-.4-.56 0-1.15.13-1.79.4-.64.27-1.16.41-1.56.42-.62.03-1.23-.24-1.81-.8-.39-.34-.87-.92-1.44-1.74C.4 13.24.01 12.3 0 11.29c0-.9.2-1.68.6-2.33.3-.53.73-.95 1.3-1.27.56-.32 1.17-.48 1.82-.49.47 0 1.1.15 1.87.44.77.3 1.27.44 1.48.44.16 0 .71-.17 1.63-.51.87-.32 1.61-.45 2.22-.41 1.64.13 2.87.78 3.67 1.95-1.46.89-2.19 2.13-2.18 3.72.01 1.24.46 2.28 1.35 3.1.4.38.85.67 1.35.88l-.88.46z"/>
            <path d="M9.9 0c0 .97-.35 1.88-1.06 2.7-.85.99-1.87 1.56-2.98 1.47-.01-.11-.02-.23-.02-.36 0-.97.4-2 1.16-2.74.37-.39.85-.72 1.44-.98C9 .82 9.56.68 10.09.66c.01.1.01.21.01.31z"/>
          </svg>
        </button>
        <span id="menubar-app-name" class="menu-app-name">Finder</span>
        <div id="menubar-app-menus"><!-- App-specific menus injected here --></div>
      </div>
      <div id="menubar-right">
        <!-- WiFi SVG icon -->
        <span class="status-icon" id="sb-wifi" title="Wi-Fi">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 15" width="16" height="12" fill="currentColor">
            <path d="M10 12a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm0-3.5a5 5 0 013.54 1.46l-1.42 1.42A3 3 0 0010 10.5a3 3 0 00-2.12.88L6.46 9.96A5 5 0 0110 8.5zm0-3.5a8.5 8.5 0 016.01 2.49l-1.42 1.42A6.5 6.5 0 0010 7a6.5 6.5 0 00-4.59 1.91L3.99 7.49A8.5 8.5 0 0110 5zm0-4a12 12 0 018.49 3.5l-1.42 1.42A10 10 0 0010 3a10 10 0 00-7.07 2.92L1.51 4.5A12 12 0 0110 1z"/>
          </svg>
        </span>
        <!-- Battery SVG icon -->
        <span class="status-icon" id="sb-battery" title="Battery">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 12" width="22" height="12" fill="currentColor">
            <rect x="0.5" y="0.5" width="18" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <rect x="2" y="2" width="13" height="8" rx="1.5"/>
            <path d="M19.5 4v4a2 2 0 000-4z"/>
          </svg>
        </span>
        <!-- Volume SVG icon -->
        <span class="status-icon" id="sb-volume" title="Volume">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 16" width="16" height="13" fill="currentColor">
            <path d="M3 5.5v5h3l4 4V1.5l-4 4H3zm10.5 2.5a3.5 3.5 0 00-2.5-3.37v6.74A3.5 3.5 0 0013.5 8zM11 1.23v2.06a5.5 5.5 0 010 9.42v2.06A7.5 7.5 0 0011 1.23z"/>
          </svg>
        </span>
        <span id="menubar-clock">12:00</span>
      </div>
    </div>

    <!-- Desktop -->
    <div id="desktop">
      <div id="desktop-icons"></div>
    </div>

    <!-- Dock -->
    <div id="dock">
      <div id="dock-inner">
        <div id="dock-apps"></div>
        <div class="dock-sep"></div>
        <div class="dock-item" id="dock-trash">
          <!-- Trash SVG icon -->
          <div class="dock-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 54" width="48" height="48" fill="none">
              <defs>
                <linearGradient id="trash-body-grad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
                  <stop offset="0%" stop-color="#b8d4ee"/>
                  <stop offset="100%" stop-color="#5b9ec9"/>
                </linearGradient>
                <linearGradient id="trash-lid-grad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
                  <stop offset="0%" stop-color="#cfe4f4"/>
                  <stop offset="100%" stop-color="#8fbdd8"/>
                </linearGradient>
              </defs>
              <!-- Handle -->
              <rect x="17" y="4" width="14" height="6" rx="3" fill="url(#trash-lid-grad)" stroke="#4a88b8" stroke-width="0.8"/>
              <!-- Lid -->
              <rect x="2" y="9" width="44" height="7" rx="3.5" fill="url(#trash-lid-grad)" stroke="#4a88b8" stroke-width="0.8"/>
              <!-- Body -->
              <rect x="6" y="15" width="36" height="35" rx="4" fill="url(#trash-body-grad)" stroke="#4a88b8" stroke-width="0.8"/>
              <!-- Divider lines -->
              <line x1="16" y1="21" x2="16" y2="44" stroke="#4a88b8" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
              <line x1="24" y1="21" x2="24" y2="44" stroke="#4a88b8" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
              <line x1="32" y1="21" x2="32" y2="44" stroke="#4a88b8" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
              <!-- Shine -->
              <ellipse cx="16" cy="20" rx="4" ry="2" fill="white" opacity="0.3"/>
            </svg>
          </div>
          <span class="dock-label">Trash</span>
        </div>
      </div>
    </div>

  </div><!-- /#os-shell -->

  <!-- Window layer (all app windows go here) -->
  <div id="window-layer"></div>

  <!-- Notification container -->
  <div id="notifications"></div>

  <!-- Shared dropdown overlay + menu (for menubar dropdowns) -->
  <div id="dropdown-overlay"></div>
  <div id="dropdown-menu"></div>

  <!-- Calendar popover -->
  <div id="cal-popover"></div>

  <!-- Desktop context menu -->
  <div id="ctx-menu"></div>

  <script src="js/core.js"></script>
  <script src="js/apps.js"></script>
</body>
</html>
